name: release

on:
  push:
    branches:
      - main
      
jobs:
  tag: 
    name: create release tag
    runs-on: ubuntu-latest

    permissions:
     contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch