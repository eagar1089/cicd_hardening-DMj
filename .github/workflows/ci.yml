name: CI Pipeline
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
jobs:
  code-quality:
    name: Lint + Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff checks
        run: ruff check backend/
        # Checks all .py files in backend/ for style and syntax issues.
    
  
